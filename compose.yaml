services:
  app:
    build: .
    container_name: telegram-bot
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/.venv

  db:
    image: postgres:17
    container_name: telegram-bot-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
volumes:
  db-data: